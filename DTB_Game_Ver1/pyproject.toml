[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtb-game-dynamics-unnormalized"
version = "0.1.0"
description = "Unnormalized Neural-DTB projection for distributional game dynamics"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["game_dtb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
